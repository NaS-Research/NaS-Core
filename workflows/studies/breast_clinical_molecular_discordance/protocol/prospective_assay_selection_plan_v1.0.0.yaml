intended_use: >-
  Research-use post-extraction technical calibration of a patient-independent PAM50
  reliability and abstention rule; not diagnosis, treatment selection, or clinical use.
primary_repeat_architecture: >-
  Paired aliquots of the same homogenized RNA undergo independent library preparation,
  library QC, randomized sequencing placement, and independent bioinformatic processing.
candidates:
  - candidate_id: ASSAY-001
    assay_family: Research-use whole-transcriptome stranded bulk RNA sequencing
    measurement_scope: Genome-wide messenger RNA abundance with the full PAM50 panel
    repeat_architecture_compatible: true
    full_pam50_panel_feasible: true
    high_quality_rna_compatible: true
    degraded_or_ffpe_compatible: false
    fixed_reference_bridge_status: requires_platform_conformance
    disposition: selected_family
    rationale:
      - Closest measurement family to the RNA-seq discovery and unchanged validation program.
      - Supports independent same-RNA library preparation and operational batch randomization.
      - Preserves whole-transcriptome QC and library-size diagnostics beyond the 50-gene panel.
      - Exact chemistry remains unresolved until the intended RNA-quality range is frozen.
    official_documentation_urls:
      - https://support-docs.illumina.com/LP/IlluminaStrandedmRNA/Content/LP/Illumina_RNA/Stranded-mRNA/Overview.htm
  - candidate_id: ASSAY-002
    assay_family: Degraded-RNA-compatible stranded total or capture-enriched RNA sequencing
    measurement_scope: Whole or coding-transcriptome abundance from degraded or FFPE RNA
    repeat_architecture_compatible: true
    full_pam50_panel_feasible: true
    high_quality_rna_compatible: true
    degraded_or_ffpe_compatible: true
    fixed_reference_bridge_status: requires_platform_conformance
    disposition: conditional_contingency
    rationale:
      - Retained only if the intended specimen range includes degraded or FFPE-derived RNA.
      - Capture or depletion changes measurement behavior and cannot inherit the polyA reference bridge.
      - Requires separate reference, transformation, and technical-error conformance before use.
    official_documentation_urls:
      - https://www.illumina.com/techniques/sequencing/rna-sequencing.html
      - https://www.illumina.com/products/by-type/sequencing-kits/library-prep-kits/rna-prep-enrichment.html
  - candidate_id: ASSAY-003
    assay_family: Targeted hybridization expression assay such as NanoString PAM50
    measurement_scope: Targeted transcript abundance
    repeat_architecture_compatible: true
    full_pam50_panel_feasible: true
    high_quality_rna_compatible: true
    degraded_or_ffpe_compatible: true
    fixed_reference_bridge_status: materially_different_measurement_family
    disposition: not_selected_primary
    rationale:
      - Platform-specific counts and normalization are not interchangeable with the frozen RNA-seq bridge.
      - Would require a distinct intended use, reference, calibration experiment, and validation program.
      - Commercial or proprietary implementation questions remain outside this planning freeze.
    official_documentation_urls:
      - https://www.prosigna.com/
  - candidate_id: ASSAY-004
    assay_family: Targeted amplicon RNA sequencing
    measurement_scope: Fixed targeted gene panel
    repeat_architecture_compatible: true
    full_pam50_panel_feasible: true
    high_quality_rna_compatible: true
    degraded_or_ffpe_compatible: true
    fixed_reference_bridge_status: materially_different_measurement_family
    disposition: not_selected_primary
    rationale:
      - A panel-only workflow changes dynamic range, normalization, and whole-transcriptome QC.
      - It cannot inherit the current fixed reference or retrospective validation bridge.
    official_documentation_urls:
      - https://www.illumina.com/techniques/sequencing/rna-sequencing/targeted-rna-seq.html
