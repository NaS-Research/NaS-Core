unresolved_prerequisites:
  - Intended specimen format and high-quality versus degraded RNA range
  - Minimum RNA quantity, integrity, purity, and DV200 or RIN acceptance rules
  - Exact library chemistry, read layout, depth, instrument family, and batch design
  - Platform-matched fixed-reference and transformation conformance
  - Pilot attrition, batch, score-error, and margin-error estimates
  - Lawful specimen source, governance, budget, and operational feasibility
