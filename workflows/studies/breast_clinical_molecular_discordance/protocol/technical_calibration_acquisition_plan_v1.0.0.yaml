centroid_candidate_sha256: 51a1b186a32ba02fa61a001ee7dc7e21876b9b09f78cb7eb8f0fdd068b4f8c2b
purpose: >-
  Identify a lawful, classifier-independent, external-validation-independent paired
  molecular resource capable of calibrating technical perturbations and a fixed
  reliability-abstention rule without using outcomes or validation performance.
prohibited_uses:
  - Do not use GSE96058 to select perturbation distributions, margins, label-retention thresholds, or abstention thresholds.
  - Do not use TCGA or GSE96058 outcomes to select or revise any reliability threshold.
  - Do not infer participant-level error distributions from aggregate agreement percentages.
  - Do not treat biological, spatial, longitudinal, or treatment-related pairs as technical replicates.
  - Do not authorize molecular execution merely because a source is identified.
acceptance_criteria:
  - criterion_id: CAL-001
    requirement: The calibration samples did not contribute to classifier or centroid training.
    rationale: Training overlap would make the apparent technical performance optimistic.
    mandatory: true
    resolution_status: unresolved
  - criterion_id: CAL-002
    requirement: The calibration samples are absent from the locked external-validation population.
    rationale: Reliability rules must be frozen before the external validation source is examined.
    mandatory: true
    resolution_status: unresolved
  - criterion_id: CAL-003
    requirement: Participant-level paired molecular values and stable pair identifiers are lawfully available.
    rationale: Aggregate agreement cannot support perturbation distributions or patient-level abstention calibration.
    mandatory: true
    resolution_status: unresolved
  - criterion_id: CAL-004
    requirement: Each pair represents a declared technical repeat of the same RNA or same homogenized specimen.
    rationale: Biological and spatial heterogeneity cannot be labeled measurement error.
    mandatory: true
    resolution_status: unresolved
  - criterion_id: CAL-005
    requirement: All governed classifier genes and required technical metadata are present without ambiguous mapping.
    rationale: Partial panels or unresolved gene identities would change the declared classifier.
    mandatory: true
    resolution_status: unresolved
  - criterion_id: CAL-006
    requirement: Assay, normalization, preprocessing, missingness, QC, and replicate-generation procedures can be frozen.
    rationale: Reproducibility requires an executable and auditable measurement bridge.
    mandatory: true
    resolution_status: unresolved
  - criterion_id: CAL-007
    requirement: Minimum pair count and precision targets are justified in a prospective power analysis.
    rationale: A convenient pair count must not silently determine reliability claims.
    mandatory: true
    resolution_status: unresolved
  - criterion_id: CAL-008
    requirement: Threshold calibration excludes clinical outcomes and external-validation performance.
    rationale: The reliability rule must measure technical evidence rather than optimize apparent clinical results.
    mandatory: true
    resolution_status: unresolved
