next_actions:
  - Preserve GSE96058 as validation-only unless the founder formally redesigns the study.
  - Prepare but do not send a data-access inquiry for the Hurson et al. participant-level replicate values and metadata.
  - Run a bounded source-discovery audit for independent RNA-seq technical replicate resources.
  - Draft a prospective NaS replicate-study design and power-analysis inputs without initiating procurement or laboratory work.
  - Re-evaluate eligibility only after a founder method route is selected.
