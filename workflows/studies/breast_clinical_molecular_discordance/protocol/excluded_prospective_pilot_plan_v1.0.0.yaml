attempted_pair_target: 30
independent_biological_source_target: 30
measurements_per_pair: 2
pilot_role: excluded_feasibility_pilot
pair_unit: same_homogenized_rna_independent_libraries
immutable_identifier_levels:
  - specimen
  - rna_aliquot
  - replicate_pair
  - library
  - sequencing_run
  - processing_instance
randomization_factors:
  - library_preparation_batch
  - sequencing_run
  - run_position
  - replicate_mate
blinding_requirements:
  - Laboratory operators remain blinded to outcomes, subtype, and paired-mate results.
  - Analysts receive coded pair and processing identifiers without direct identities or outcomes.
  - Pair keys remain separate from molecular values until prespecified reconciliation.
control_requirements:
  - One reproducible positive process control balanced across every library batch and run.
  - One negative control balanced across every library batch and run.
  - Control failures trigger the prespecified batch failure rule and remain counted.
retained_denominators:
  - attempted_biological_sources
  - attempted_pairs
  - attempted_measurements
  - rna_gate_failures
  - library_failures
  - sequencing_failures
  - processing_failures
  - panel_incomplete_measurements
  - score_failed_measurements
  - valid_measurements
  - valid_pairs
  - reruns
  - replacements
  - abstentions
permitted_estimates:
  - assay_and_classifier_attrition
  - pam50_panel_missingness
  - paired_subtype_score_difference_variance
  - paired_runner_up_margin_difference_variance
  - batch_and_run_variance_components
  - within_pair_correlation
  - invalid_assay_rerun_and_abstention_frequency
prohibited_uses:
  - final_reliability_claim
  - final_threshold_selection
  - clinical_outcome_association
  - external_validation
  - primary_calibration_pooling
  - diagnostic_or_treatment_use
nonoverlap_populations:
  - classifier_training
  - gse81538_reference_development
  - tcga_brca_discovery
  - gse96058_external_validation
  - future_primary_calibration
