    stable_pair_identifiers_available: true
    full_classifier_panel_confirmed: false
    lawful_access_verified: true
    candidate_for_threshold_calibration: false
    limitations:
      - Official GEO metadata reports 49 tumors and six labeled technical replicates with public processed expression.
      - Both this pilot and GSE96058 arise from SCAN-B; sample non-overlap and analytic independence are not yet verified.
      - Six pairs cannot be accepted without a prospective precision and power analysis.
      - Metadata-only review did not inspect expression values or verify exact 50-gene coverage.
      - Raw-read access and privacy language are internally nuanced, so only the public processed files are in scope.
  - source_id: CALSRC-006
    label: GSE130397 archival FFPE RNA-seq library-method replicates
    evidence_ids:
      - GEO:GSE130397
      - PMID:31856832
    assay_or_platform: Illumina HiSeq 2500; Illumina Access and NuGEN Ovation FFPE library methods
    access_class: public_open
    disposition: requires_due_diligence
    independent_from_classifier_training: true
    independent_from_external_validation: true
    paired_measurements_reported: true
    participant_level_molecular_values_available: true
    stable_pair_identifiers_available: true
    full_classifier_panel_confirmed: false
    lawful_access_verified: true
    candidate_for_threshold_calibration: false
    limitations:
      - Official GEO metadata reports triplicate libraries for only two ER-positive FFPE source specimens under two library methods.
      - The resource can characterize within-specimen and library-method variation but cannot represent patient-level subtype-margin diversity.
      - Additional resequenced singlets are present, but their exact role requires a frozen pairing audit.
      - Metadata-only review did not inspect expression values or verify exact 50-gene coverage.
recommended_actions:
  - Treat GSE60788 and GSE130397 as feasibility or variance-component candidates, not threshold-calibration sources.
  - Verify GSE60788 sample non-overlap with GSE96058 and confirm whether all six pairs are same-RNA library reconstructions.
  - Run a future field-isolated panel and pair-lineage audit only after the founder selects a method route.
  - Ask the Hurson corresponding author whether deidentified paired PAM50 values and stable replicate mappings can be shared under a research agreement.
  - Do not combine small heterogeneous replicate studies into one error distribution without a prospective hierarchical model and statistical review.
