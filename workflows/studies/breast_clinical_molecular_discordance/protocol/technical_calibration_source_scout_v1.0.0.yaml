findings:
  - source_id: CALSRC-005
    label: GSE60788 SCAN-B pilot RNA-seq technical replicates
    evidence_ids:
      - GEO:GSE60788
      - PMID:25722745
    assay_or_platform: Illumina HiSeq 2000 paired-end bulk RNA sequencing
    access_class: public_open
    disposition: requires_due_diligence
