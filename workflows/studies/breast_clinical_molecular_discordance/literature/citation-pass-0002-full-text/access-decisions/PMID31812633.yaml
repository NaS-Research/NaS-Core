policy_reason: >-
  The official publisher and PubMed pages expose bibliographic metadata and the
  abstract, but no approved repository identifier is present. The Elsevier
  full-text API requires an API key and the publisher page did not provide a
  reproducible, checksum-verifiable credential-free article route. No access
  control was bypassed, no third-party copy was retained, and abstract-only
  content is insufficient for a governed quality appraisal.
