rationale: >-
  Second-stage title-and-abstract review retains only records with a direct
  classifier, assay, platform, specimen, normalization, implementation-comparison,
  or molecular-versus-surrogate contribution to question 0.3.0. Outcome association,
  treatment selection, cost effectiveness, new subtype discovery, general molecular
  characterization, secondary literature, and unrelated disease methods are
  recommended for exclusion. Recommendations remain advisory until founder
  confirmation.
