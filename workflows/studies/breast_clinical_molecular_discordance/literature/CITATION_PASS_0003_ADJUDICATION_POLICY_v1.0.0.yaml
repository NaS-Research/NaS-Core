rationale: >-
  Second-stage title-and-abstract review retains only high-confidence records
  with a direct single-sample classifier and explicit perturbation tests,
  molecular-versus-image classifier comparison, multiregional subtype
  discordance, tumor-composition sensitivity, cross-platform classification
  disagreement, or paired frozen-versus-FFPE subtype validation relevant to
  question 0.3.0. Secondary commentary, outcome-only studies, unrelated
  molecular taxonomy, deconvolution without a direct subtype-reliability
  comparison, and records lacking sufficient metadata remain recommended for
  exclusion. Recommendations remain advisory until the founder confirms both
  checksum-bound pass-3 packets.
founder_confirmation_required: true
autonomous_decisions_allowed: false
