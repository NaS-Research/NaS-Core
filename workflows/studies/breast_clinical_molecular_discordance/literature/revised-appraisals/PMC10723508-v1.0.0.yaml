title: Multiplexed RNA-FISH-guided Laser Capture Microdissection RNA Sequencing Improves Breast Cancer Molecular Subtyping, Prognostic Classification, and Predicts Response to Antibody Drug Conjugates.
pmid: '38105959'
doi: 10.1101/2023.12.05.23299341
full_text_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10723508/
