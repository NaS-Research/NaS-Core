study_design: analytical_validation
eligibility: eligible
domains:
  - domain: population_selection
    judgment: some_concerns
    rationale: >-
      Technical replicates came from 144 FFPE tumors in the UNC Normal Breast
      Study and Carolina Breast Cancer Study. The 40 spatial comparisons
      deliberately oversampled histologically distinct regions, which is useful
      as a challenge design but may overstate discordance in routine sampling.
    evidence_locations:
      - Methods — Study population
      - Methods — Tumor samples
      - Results
  - domain: specimen_and_measurement
    judgment: some_concerns
    rationale: >-
      Duplicate assays on the same RNA isolate cleanly estimate a technical
      component, while pathologist-selected spatial cores estimate combined
      sampling and biological heterogeneity. The research probes differ slightly
      from the commercial assay and the study does not include cross-laboratory,
      batch, operator, or independent re-extraction replication.
    evidence_locations:
      - Methods — Tumor samples
      - Results
      - Discussion — strengths and limitations
  - domain: classifier_implementation
    judgment: some_concerns
    rationale: >-
      The analysis uses the same PAM50 genes and algorithm as Prosigna and reports
      subtype, ROR-P group, confidence, and expression-space distances. Exact
      centroids, normalization constants, software version, and executable code
      are not pinned to the report, limiting independent reconstruction.
    evidence_locations:
      - Methods — Tumor samples
      - Results
      - Discussion
  - domain: reference_comparator
    judgment: some_concerns
    rationale: >-
      Same-RNA technical replicates provide a valid repeatability comparator and
      spatial pairs directly address sampling heterogeneity. Neither measurement
      is a biological gold standard, so discordant pairs cannot identify which
      subtype is correct or whether a changed category improves care.
    evidence_locations:
      - Methods
      - Results
      - Discussion — limitations
  - domain: analysis_and_statistics
    judgment: some_concerns
    rationale: >-
      The study reports paired categorical agreement and expression/ROR-P
      distances and uses Wilcoxon tests for distance differences. It does not
      report confidence intervals for agreement, kappa, a prespecified acceptable
      reproducibility threshold, multiplicity control, or calibrated error
      probabilities; the spatial sample is small.
    evidence_locations:
      - Methods — Statistical analysis
      - Results
      - Table 1
  - domain: validation_and_transportability
    judgment: some_concerns
    rationale: >-
      Results are internally informative but are not validated in a held-out
      laboratory or population. The study does not convert replicate discordance
      into a transportable patient-level reliability score, unchanged threshold,
      or abstention rule and does not test decision or outcome effects.
    evidence_locations:
      - Results
      - Discussion — strengths and limitations
      - Conclusion
  - domain: reporting_and_reproducibility
    judgment: some_concerns
    rationale: >-
      Sampling, replicate counts, agreement results, distance summaries,
      histopathology features, and limitations are clearly reported under CC BY.
      Patient-level data and a fully pinned executable implementation are not
      supplied with the article.
    evidence_locations:
      - Methods
      - Tables 1–2
      - Data availability
evidence_role: supporting
key_strengths:
  - Separates same-RNA technical repeatability from spatial intratumoral variation.
  - Includes 144 technical replicate pairs and a pathologist-directed spatial challenge set.
  - Reports 90% technical and 76% spatial agreement for PAM50 subtype.
  - Shows that roughly half of technical subtype discordance is Luminal A versus Luminal B.
  - Compares continuous expression and ROR-P distances for concordant and discordant pairs.
key_limitations:
  - The spatial challenge contains only 40 tumors and deliberately samples heterogeneous regions.
  - Agreement lacks confidence intervals and no acceptable reliability threshold was prespecified.
  - The research assay is not an exact locked commercial Prosigna implementation.
  - No independent laboratory, external cohort, outcome analysis, or clinical decision evaluation is included.
  - The work does not provide a calibrated patient-level error probability or abstention rule.
