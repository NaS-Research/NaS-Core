eligibility: eligible
domains:
  - domain: population_selection
    judgment: some_concerns
    rationale: >-
      Stable genes were derived from TCGA carcinomas and CCLE carcinoma cell lines,
      then evaluated across 14 datasets comprising approximately 13,000 samples.
      The breadth is substantial, but it intentionally favors solid-tumor contexts
      and performs poorly in blood, limiting domain-general transport.
    evidence_locations:
      - Materials and Methods — Pre-processing datasets
      - Results — Selecting stably expressed genes
      - Discussion
  - domain: specimen_and_measurement
    judgment: some_concerns
    rationale: >-
      Evaluation spans RNA-seq pipelines, RT-qPCR, microarrays, normal tissues,
      tumors, cell lines, and perturbation data. Most targeted-panel comparisons
      are down-sampled from whole-transcriptome measurements; matched RNA-seq and
      RT-qPCR validation uses only four SEQC reference mixtures rather than
      independent clinical specimens.
    evidence_locations:
      - Materials and Methods — Pre-processing datasets
      - Results — Computing gene expression signature scores
  - domain: classifier_implementation
    judgment: low
    rationale: >-
      stingscore uses fixed stable-gene lists and within-sample ranks, requires no
      accompanying patient cohort, and is implemented in versioned Bioconductor
      functions. The method therefore establishes executable single-sample,
      reduced-panel scoring prior art.
    evidence_locations:
      - Materials and Methods — Computing gene set scores using stable genes
      - Results — Relative ranks of stable genes
      - Data availability
  - domain: reference_comparator
    judgment: some_concerns
    rationale: >-
      Whole-transcriptome singscore serves as the principal comparator for reduced-
      panel stingscore, and expected mixture ordering provides a useful construct
      check. Neither is a clinical truth standard; the 24-patient docetaxel example
      is a small retrospective discrimination exercise, not a validated predictive
      biomarker comparison.
    evidence_locations:
      - Results — Computing gene expression signature scores using a reduced number of measurements
      - Figure 4
  - domain: analysis_and_statistics
    judgment: some_concerns
    rationale: >-
      Eight stability rankings, product-of-ranks aggregation, rank-consistency,
      mean absolute error across 3,009 signatures and 75,012 measurements, and
      cross-platform checks form a broad methods assessment. The docetaxel
      signature is derived from MCF7 perturbations and tested in only 24 patients
      with t tests and AUCs, without an independent holdout or multiplicity plan.
    evidence_locations:
      - Materials and Methods — Computing metrics of variability
      - Materials and Methods — Deriving a docetaxel gene signature
      - Results — Computing gene expression signature scores
  - domain: validation_and_transportability
    judgment: some_concerns
    rationale: >-
      Stable-gene behavior is replicated across diverse independent datasets and
      platforms, and the algorithm is patient-independent. Score offsets remain
      between full-transcriptome and targeted implementations, stability is poor
      in blood, and no unchanged PAM50-specific or prospective clinical validation
      is performed.
    evidence_locations:
      - Results — Comparison against other lists of stable genes
      - Results — Relative ranks of stable genes
      - Discussion
  - domain: reporting_and_reproducibility
    judgment: low
    rationale: >-
      Public accessions, preprocessing, metrics, package versions, supplementary
      code, the complete stable-gene list, and R/Bioconductor implementation are
      reported under CC BY. The study is unusually reproducible for a methods
      paper, although not distributed as one immutable environment image.
    evidence_locations:
      - Materials and Methods
      - Data availability
      - Supplementary data
evidence_role: supporting
key_strengths:
  - Implements fixed, patient-independent single-sample signature scoring.
  - Reduces measurement requirements from whole transcriptomes to signature genes plus stable controls.
  - Evaluates stability across approximately 13,000 samples and 14 datasets.
  - Tests 3,009 signatures across 75,012 perturbation measurements.
  - Provides a public Bioconductor implementation and stable-gene list.
key_limitations:
  - Stable genes were optimized for solid-tumor contexts and perform inconsistently in blood.
  - Most targeted-panel validation is simulated by down-sampling transcriptome data.
  - Targeted and whole-transcriptome scores retain variable offsets.
  - The docetaxel clinical example contains only 24 patients and no independent holdout.
  - The work does not calibrate PAM50 call reliability or abstention.
