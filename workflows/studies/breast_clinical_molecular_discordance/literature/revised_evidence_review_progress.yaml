unresolved_claims:
  - >-
    Whether the published AWCA artifacts provide lawfully reusable, sufficiently frozen
    centroids, reference values, and transformations for unchanged NaS execution.
  - >-
    Whether an existing single-subject uncertainty or Not Assigned method already
    resolves the proposed NaS margin, reliability, and abstention contribution.
  - >-
    Whether MiniABS model 0.1.1 can be lawfully frozen and reproduced unchanged,
    and whether its seven-model vote exposes sufficient score information for an
    independently calibrated reliability and abstention layer.
  - >-
    Whether the sspbc package exposes stable rule-level scores and sufficient
    provenance to add patient-level reliability and abstention without retraining
    on the proposed validation cohort.
  - >-
    Whether individual-gene perturbation adds independently validated, technically
    calibrated information beyond published best-runner-up margins, gene-cluster
    removal, gene-removal, and permutation methods.
  - >-
    Which independently measured technical-error model is transportable to TCGA RNA-seq
    and processed GSE96058 expression, if any.
  - >-
    Whether any margin or canonical-label-retention threshold has a defensible,
    non-outcome-guided calibration target and independent validation.
  - >-
    Whether fixed external centering can be transported across RSEM-style TCGA data and
    processed GSE96058 FPKM without validation-cohort adaptation.
  - >-
    Whether the exact question 0.3.0 contribution remains differentiated after current
    single-sample classifiers, uncertainty methods, and reproducible software are appraised.
  - >-
    Whether BreastSubtypeR inter-method entropy can be frozen and calibrated to
    patient-level analytical error or abstention without using cohort-aware AUTO
    selection or validation outcomes.
