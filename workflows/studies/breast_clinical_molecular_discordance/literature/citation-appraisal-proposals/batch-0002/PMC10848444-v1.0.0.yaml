title: Ensemble methods of rank-based trees for single sample classification with gene expression profiles
pmid: '38321494'
doi: 10.1186/s12967-024-04940-2
full_text_source_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10848444/fullTextXML
