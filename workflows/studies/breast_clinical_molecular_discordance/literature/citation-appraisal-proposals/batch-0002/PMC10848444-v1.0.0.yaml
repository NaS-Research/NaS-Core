study_design: classifier_comparison
eligibility: eligible
domains:
  - domain: population_selection
    judgment: some_concerns
    rationale: >-
      Twelve retrospective public cancer datasets span 22 to 587 samples and 85 to
      2,526 genes. The TNBC evaluation combines four published datasets totaling
      375 samples across microarray and RNA-seq. This breadth is useful, but many
      cohorts are very small, selected benchmark datasets with limited clinical
      characterization.
    evidence_locations:
      - Methods — Gene expression data and evaluation methods
      - Table 1 — Binary and multi-class datasets
  - domain: specimen_and_measurement
    judgment: some_concerns
    rationale: >-
      Rank comparisons reduce dependence on absolute expression scale and TNBC
      includes microarray and RNA-seq datasets. Only 49 genes were common across
      TNBC platforms, and preprocessing, laboratory, specimen, and cohort effects
      are not isolated through paired samples or technical replicates.
    evidence_locations:
      - Methods — Gene expression data and evaluation methods
      - Results
      - Table 2 — Dimension reduction results
  - domain: classifier_implementation
    judgment: some_concerns
    rationale: >-
      Rank-tree, random-rank-forest, boosting, variable-importance, class balancing,
      tuning, and comparator implementations are mathematically described, and
      source is public. Many influential hyperparameters require dataset-specific
      grid search, tie handling remains unresolved, and no single frozen artifact
      or abstention threshold is identified for breast cancer.
    evidence_locations:
      - Methods — Rank-based trees
      - Methods — Ensemble Algorithm with reduced dimension
      - Discussion
      - Availability of data and materials
  - domain: reference_comparator
    judgment: some_concerns
    rationale: >-
      The methods predict historical benchmark class labels and are compared with
      k-TSP and nearest-template prediction. These labels enable method comparison
      but are not an independent biological or clinical gold standard, and
      comparator underperformance does not establish patient-level correctness.
    evidence_locations:
      - Methods — Gene expression data and evaluation methods
      - Methods — Other SSP methods and algorithm implementation
  - domain: analysis_and_statistics
    judgment: some_concerns
    rationale: >-
      Class-balanced 70/15/15 training, validation, and test splits were repeated
      50 times, with held-out accuracy and variable-selection summaries. The work
      compares many datasets, methods, and tuning choices without confidence
      intervals or multiplicity control, and accuracy alone does not assess
      calibration, class-specific error, or abstention.
    evidence_locations:
      - Methods — Performance measures
      - Results
  - domain: validation_and_transportability
    judgment: high
    rationale: >-
      The methods section states that TNBC training and testing crossed microarray
      and RNA-seq platforms, but the results aggregate TNBC accuracy and do not
      provide a distinct per-direction cross-platform estimate, unchanged artifact,
      or independently frozen external test. No prospective assay, clinical cohort,
      or patient-decision transport is evaluated.
    evidence_locations:
      - Methods — Gene expression data and evaluation methods
      - Table 1 footnote c
      - Results
  - domain: reporting_and_reproducibility
    judgment: some_concerns
    rationale: >-
      Algorithms, public dataset references, split proportions, repetitions,
      comparator packages, source code, and aggregate results are reported.
      Reproduction of the claimed cross-platform TNBC result is weakened by absent
      per-dataset performance, seeds, exact split assignments, and a frozen model.
    evidence_locations:
      - Methods
      - Results
      - Availability of data and materials
proposed_evidence_role: context_only
key_strengths:
  - Extends pairwise rank rules to interpretable multivariate trees and ensembles.
  - Uses held-out test partitions repeated 50 times across 12 cancer datasets.
  - Makes source code and public-data provenance available.
  - Explicitly acknowledges tie and zero-heavy-data limitations.
key_limitations:
  - Cross-platform TNBC performance is not separately reported by train/test direction.
  - Small benchmark cohorts and historical labels limit clinical interpretation.
  - Accuracy omits calibration, class-specific uncertainty, and abstention.
  - Dataset-specific tuning is required and no fixed breast artifact is validated.
