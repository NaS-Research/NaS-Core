domains:
- domain: population_selection
  judgment: high
  rationale: The retrospective sample combines five studies and one trial at one Korean center. Cohort-specific
    enrollment, treatment, tissue availability, and follow-up can jointly affect subtype composition and
    survival comparisons.
  evidence_locations:
  - "Methods \u2014 Patients"
  - Supplementary Table 1
- domain: specimen_and_measurement
  judgment: some_concerns
  rationale: FFPE regions with more than 75% tumor were microdissected, IHC and HER2 testing were clinically
    defined, and NanoString measured PAM50 genes. Nonetheless, six source cohorts may differ in archival
    quality, and the targeted-mutation subset contains only 118 samples.
  evidence_locations:
  - "Methods \u2014 DNA/RNA extraction"
  - "Methods \u2014 sequencing"
- domain: classifier_implementation
  judgment: high
  rationale: The research PAM50 implementation merged Samsung NanoString expression with TCGA data, applied
    ComBat, and then used Bioclassifier centroids. This cohort-dependent adjustment differs from a locked
    commercial single-sample assay and may alter assignments when reference composition changes.
  evidence_locations:
  - "Methods \u2014 PAM50 prediction"
  - "Discussion \u2014 limitations"
- domain: reference_comparator
  judgment: some_concerns
  rationale: IHC and FISH are clinically meaningful comparators, but the paper defines concordance through
    a chosen mapping between pathology and intrinsic labels. Neither measurement is established as the
    universal ground truth for every discordant case.
  evidence_locations:
  - "Abstract \u2014 Methods"
  - Supplementary Figure 1
- domain: analysis_and_statistics
  judgment: high
  rationale: The paper reports Fisher tests, false-discovery-rate correction, Kaplan-Meier, log-rank,
    and Cox methods. Mutation analyses use a selected 118-case subset, survival contrasts are observational,
    treatment differences can confound outcomes, and the headline treatment explanation is not causally
    identified.
  evidence_locations:
  - "Methods \u2014 Statistical analysis"
  - "Results \u2014 survival"
- domain: validation_and_transportability
  judgment: high
  rationale: No external cohort tests the same preprocessing and discordance associations. The single-center,
    multi-cohort Korean sample and TCGA-adjusted classifier cannot establish prospective transport, treatment
    benefit, or general population calibration.
  evidence_locations:
  - "Discussion \u2014 limitations"
  - Supplementary Figure 7
- domain: reporting_and_reproducibility
  judgment: some_concerns
  rationale: Assays, software versions, thresholds, mutation filters, correction methods, supplements,
    and major limitations are reported. The exact integrated reference matrix and a frozen patient-level
    classifier artifact are not supplied for independent reproduction.
  evidence_locations:
  - Methods
  - Electronic Supplement
proposed_evidence_role: context_only
key_strengths:
- Evaluates 607 patients with paired pathology and gene-expression subtype information.
- Reports an overall discordance rate near 39% and subtype-specific patterns.
- Includes long follow-up plus explicit mutation and survival analyses.
- Acknowledges cohort configuration, sample quality, and small mutation subsets.
key_limitations:
- Retrospective aggregation of six cohorts creates selection and treatment heterogeneity.
- TCGA merging and batch correction make subtype assignment reference dependent.
- Mutation findings arise from only 118 selected samples.
- Observed survival differences cannot prove that discordance or undertreatment caused outcomes.
conflicts_and_funding: The article reports no relevant conflict of interest. Samsung Biomedical Research
  Institute funded the work. The founder packet should retain the institutional funding relationship when
  interpreting the single-center retrospective analyses.
