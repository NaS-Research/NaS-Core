study_design: prediction_model
eligibility: eligible
domains:
  - domain: population_selection
    judgment: some_concerns
    rationale: >-
      The gold-standard design uses the same TCGA patients measured by Agilent
      microarray and RNA sequencing: 431 breast and 187 colon cases after filtering.
      This isolates platform effects well, but only two cancer cohorts and selected
      cases with paired measurements and existing subtype labels are studied.
    evidence_locations:
      - Methods — Study design
      - Methods — Dataset descriptions and processing
  - domain: specimen_and_measurement
    judgment: some_concerns
    rationale: >-
      Paired assays on identical biological samples are a major strength. However,
      the source matrices were already processed differently, low-expression genes
      were removed, microarray missingness was imputed, and only shared annotated
      genes were retained.
    evidence_locations:
      - Methods — Dataset descriptions and processing
      - Methods — Cross-platform normalization
  - domain: classifier_implementation
    judgment: high
    rationale: >-
      The study evaluates supervised machine-learning prediction of existing PAM50
      and colon subtype labels after feature-specific normalization. It does not
      execute a locked PAM50 centroid algorithm on one patient or define subtype
      margins, unclassifiable states, or abstention thresholds.
    evidence_locations:
      - Methods — Study design
      - Methods — Machine learning
  - domain: reference_comparator
    judgment: high
    rationale: >-
      Existing PAM50 and consensus molecular subtype labels serve as targets, but
      their derivation and biological correctness are not independently adjudicated.
      Agreement with a learned target label cannot identify the correct label for a
      discordant patient.
    evidence_locations:
      - Methods — Dataset descriptions and processing
      - Discussion
  - domain: analysis_and_statistics
    judgment: low
    rationale: >-
      Identical nested cross-validation folds, positive and negative controls,
      balanced accuracy, kappa, expression error, feature-selection comparisons,
      and multivariable models provide a controlled bidirectional platform
      experiment.
    evidence_locations:
      - Methods — Study design
      - Methods — Statistical analysis
  - domain: validation_and_transportability
    judgment: high
    rationale: >-
      Bidirectional held-out folds test technological transfer within paired TCGA
      cohorts, but there is no independent institution, prospective sample stream,
      alternative tissue context, or unchanged end-to-end PAM50 validation.
      Distribution matching also requires a target cohort.
    evidence_locations:
      - Results
      - Discussion
  - domain: reporting_and_reproducibility
    judgment: low
    rationale: >-
      Public data sources, dimensions, preprocessing, normalization equations,
      software, nested validation, outcomes, and an R implementation are reported.
      The public TCGA inputs permit substantial independent replication.
    evidence_locations:
      - Methods
      - Supplementary software
proposed_evidence_role: context_only
key_strengths:
  - Uses paired microarray and RNA-sequencing measurements from the same patients.
  - Tests both transfer directions with identical nested cross-validation folds.
  - Includes PAM50-labelled TCGA-BRCA as a direct normalization case.
  - Reports both classification and gene-expression reconstruction metrics.
key_limitations:
  - Tests learned subtype prediction rather than the locked PAM50 centroid procedure.
  - Existing subtype labels are targets, not biological ground truth.
  - Feature-specific normalization requires a receiving distribution with identical genes.
  - No external clinical cohort, patient-level uncertainty, or decision utility is evaluated.
conflicts_and_funding: >-
