title: Effect of cross-platform gene-expression, computational methods on breast cancer subtyping in PALOMA-2 and PALLET studies.
pmid: '38951507'
doi: 10.1038/s41523-024-00658-y
full_text_source_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11217366/fullTextXML
