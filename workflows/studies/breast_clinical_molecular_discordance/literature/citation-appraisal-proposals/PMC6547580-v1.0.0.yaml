study_design: analytical_validation
eligibility: eligible
domains:
  - domain: population_selection
    judgment: some_concerns
    rationale: >-
      All 96 analyzed samples came from a prospective multicenter neoadjuvant trial in
      Spain and Peru and had sufficient RNA for both platforms. The cohort was deliberately
      restricted to early-stage triple-negative disease, producing 78–84% Basal-like calls;
      this limited class balance makes overall agreement easier to achieve and sharply limits
      transport to clinically HR-positive/HER2-negative tumors.
    evidence_locations:
      - Methods — Patients and samples
      - Results — Sample quality
      - Results — Intrinsic subtype calling
  - domain: specimen_and_measurement
    judgment: low
    rationale: >-
      Both NanoString and RNA-seq measurements used RNA extracted from the same pretreatment
      FFPE core biopsy, directly controlling patient, specimen, and extraction variation.
      RNA quality and platform quality-control metrics were reported, and no NanoString
      technical failures were observed beyond three negligible control/count hints.
    evidence_locations:
      - Methods — RNA extraction
      - Methods — NanoString nCounter
      - Methods — RNA-Seq
      - Results — Sample quality
  - domain: classifier_implementation
    judgment: some_concerns
    rationale: >-
      Both platforms used nearest-centroid PAM50 calls. NanoString background and
      housekeeping normalization are described; RNA-seq used fixed-upper-quartile
      normalization, log transformation, Parker scripts, and a previously determined
      ER-balanced FFPE median adjustment, with code and the adjustment supplied. Exact
      executable environments and all output artifacts are not frozen, and the adjustment
      set's independence is only briefly described.
    evidence_locations:
      - Methods — NanoString nCounter
      - Methods — RNA-Seq
      - Additional file 6
  - domain: reference_comparator
    judgment: some_concerns
    rationale: >-
      The paired-platform design is appropriate for analytical agreement, but neither
      platform is an independent biological truth standard. Subtype concordance therefore
      demonstrates reproduction of a shared classifier in these samples, not correctness of
      either call or clinical validity.
    evidence_locations:
      - Methods — NanoString nCounter
      - Methods — RNA-Seq
      - Discussion
  - domain: analysis_and_statistics
    judgment: high
    rationale: >-
      The study reports paired correlations, ICCs, Bland–Altman plots, kappa, gene-level
      correlations, and complete discordant-case details. However, the headline 96% agreement
      reclassifies three of seven raw discordances as ambiguous using a 0.10 centroid-distance
      rule without a prespecified derivation; the unadjusted call agreement is 89 of 96
      (92.7%). Precision intervals and a multiplicity plan for the many gene and score
      comparisons are absent.
    evidence_locations:
      - Methods — Statistical analysis
      - Results — Intrinsic subtype calling
      - Results — Individual gene correlation
  - domain: validation_and_transportability
    judgment: high
    rationale: >-
      There is no independent replication cohort or unchanged external transport test.
      Agreement is measured in one small, class-imbalanced triple-negative series using the
      same extracted RNA. The study does not validate behavior in luminal-dominant cohorts,
      across independent extraction laboratories, or for patient-level treatment decisions.
    evidence_locations:
      - Methods — Patients and samples
      - Discussion
      - Conclusions
  - domain: reporting_and_reproducibility
    judgment: some_concerns
    rationale: >-
      Platform protocols, software versions, normalization, the ambiguous-call rule,
      discordant cases, QC supplements, and RNA-seq adjustment materials are reported.
      Reproduction is limited by absence of a frozen complete environment and by sparse
      reporting of funding, competing interests, and the external median-adjustment derivation
      in the retrieved article text.
    evidence_locations:
      - Methods
      - Additional files 1–6
      - Acknowledgements
proposed_evidence_role: context_only
key_strengths:
  - Uses paired measurements from the same FFPE-extracted RNA in every patient.
  - Reports raw subtype discordances, ambiguity margins, centroid correlations, ICCs, and Bland–Altman analyses.
  - Provides platform-specific normalization and RNA-seq code/median-adjustment material.
  - Shows that strong platform agreement is possible under a controlled paired design.
key_limitations:
  - Only 96 patients and a highly Basal-like-enriched triple-negative cohort.
  - The reported 96% agreement depends on a post hoc ambiguity interpretation; raw agreement is 92.7%.
  - Neither platform is an independent biological or clinical reference standard.
  - No external cohort, independent laboratory, or luminal-population transport validation.
conflicts_and_funding: >-
  The retrieved article lists no acknowledgements beyond “None.” A complete funding and
  competing-interest disclosure was not identifiable in the retrieved XML, so absence of
  conflicts cannot be inferred.
