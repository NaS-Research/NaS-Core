study_design: observational_concordance
eligibility: eligible
domains:
- domain: population_selection
  judgment: some_concerns
  rationale: The study analyzes 561 eligible STO-3 trial tumors and 237 Clinseq tumors after tissue, RNA-quality,
    normal-like, date, and complete-marker exclusions. Two eras and sampling frames broaden context, but
    both are Stockholm-based and the historic trial includes only node-negative postmenopausal patients.
  evidence_locations:
  - "Methods \u2014 Study Samples"
  - Table 2
- domain: specimen_and_measurement
  judgment: high
  rationale: STO-3 used centralized retrospective IHC, microarray PAM50, whole-slide Ki-67, and no FISH
    resolution for HER2 2+ tumors. Clinseq used pathology-record IHC, hotspot Ki-67, FISH for 2+ tumors,
    and an RNA-seq-based PAM50 approach. These material measurement differences affect cross-cohort comparability.
  evidence_locations:
  - "Methods \u2014 Study Samples"
  - "Discussion \u2014 cohort differences"
- domain: classifier_implementation
  judgment: high
  rationale: Three IHC surrogates, fixed 14% and 20% Ki-67 cutoffs, and study-optimized free cutoffs were
    compared. PAM50 itself used different microarray and RNA-seq implementations across cohorts, and no
    frozen single-patient uncertainty or abstention behavior is evaluated.
  evidence_locations:
  - "Methods \u2014 Surrogate Classifications"
  - Supplementary Methods
- domain: reference_comparator
  judgment: high
  rationale: PAM50 is treated as the comparison target, not an independent biological gold standard. The
    paper assesses how well IHC surrogates mimic gene-expression labels and cannot establish that the
    PAM50 label is correct for each discordant tumor.
  evidence_locations:
  - "Introduction \u2014 study aim"
  - "Methods \u2014 Statistical Analysis"
- domain: analysis_and_statistics
  judgment: high
  rationale: Accuracy, kappa, sensitivity, specificity, ROC displays, survival curves, and flexible parametric
    treatment models are reported. Multiple classifiers and Ki-67 thresholds include study-optimized cutoffs
    without a stated study-wide multiplicity plan, and outcome contrasts are secondary.
  evidence_locations:
  - "Methods \u2014 Statistical Analysis"
  - Tables 3 and 4
- domain: validation_and_transportability
  judgment: some_concerns
  rationale: Similar rankings and the improvement after collapsing luminal classes appear in two cohorts
    with different eras and laboratory workflows. This is useful replication, but both cohorts are regional,
    implementations differ, historic treatment limits current transport, and the free thresholds are not
    externally locked.
  evidence_locations:
  - "Results \u2014 Concordance"
  - Discussion
- domain: reporting_and_reproducibility
  judgment: some_concerns
  rationale: Cohorts, exclusions, surrogate rules, cutoffs, metrics, confidence intervals, funding, conflicts,
    and limitations are reported with supplements. Sensitive participant data require legal review, and
    complete executable classifier artifacts are not provided.
  evidence_locations:
  - Methods and Supplement
  - Data Availability
proposed_evidence_role: context_only
key_strengths:
- Compares three IHC surrogate schemes within the same two PAM50 datasets.
- Includes centralized and routine multi-laboratory pathology scenarios.
- Reports confidence intervals and detailed subtype-specific misclassification.
- Repeats the main concordance pattern across two distinct clinical eras.
key_limitations:
- PAM50 is a comparator rather than proven biological truth.
- Assays, HER2 handling, Ki-67 scoring, and PAM50 implementation differ by cohort.
- Study-optimized Ki-67 cutoffs lack independent locked validation.
- Historic regional cohorts do not establish current patient-level treatment utility.
conflicts_and_funding: Funding came from the Swedish Research Council, Swedish Cancer Society, and Stockholm
  County Council. The authors stated that funders had no role in the work and disclosed no conflicts or
  financial disclosures.
