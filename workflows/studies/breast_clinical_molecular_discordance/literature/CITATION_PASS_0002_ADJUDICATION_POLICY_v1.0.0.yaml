rationale: >-
  Second-stage title-and-abstract review retains only high-confidence records
  with a direct single-sample classifier method, analytical or external
  classifier validation, explicit robustness to platform, preprocessing, RNA
  quality, batch, purity, or specimen preservation, multiregional subtype
  heterogeneity, or standardized surrogate-threshold reproducibility relevant
  to question 0.3.0. Secondary commentary, outcome-only studies, unrelated
  molecular characterization, nonhuman studies, and the unmatched CTX metadata
  record remain recommended for exclusion. Recommendations remain advisory
  until the founder confirms both checksum-bound pass-2 packets.
