study_design: prediction_model
eligibility: eligible
domains:
- domain: population_selection
  judgment: some_concerns
  rationale: Centroids were trained on 514 FFPE samples, the ROR model on 304 untreated cases, and verification
    used an independent 232-case tamoxifen cohort. Historical treatment and selected tissue availability
    limit current representativeness.
  evidence_locations:
  - "Methods \u2014 Clinical samples"
  - "Results \u2014 Sample processing and assay success"
- domain: specimen_and_measurement
  judgment: low
  rationale: The fixed nCounter FFPE workflow specifies macrodissection, 46 classifier genes, eight housekeeping
    genes, positive and negative controls, and a reference sample. Assay-quality exclusions are explicitly
    reported.
  evidence_locations:
  - "Methods \u2014 Prosigna assay"
  - "Results \u2014 RNA and FFPE sample testing"
- domain: classifier_implementation
  judgment: low
  rationale: Training-set normalization, four fixed subtype centroids, Pearson correlations, the proliferation
    score, tumor size, and the ridge-regression ROR equation are specified as a locked single-patient
    algorithm.
  evidence_locations:
  - "Methods \u2014 PAM50 classifier"
  - "Methods \u2014 Risk of recurrence model"
- domain: reference_comparator
  judgment: some_concerns
  rationale: Verification compares the assay with the published research predictor and evaluates association
    with recurrence, but no independent biological subtype truth exists and the outcome comparator reflects
    historical care.
  evidence_locations:
  - "Methods \u2014 Verification study"
  - "Results \u2014 Verification of the clinical algorithm"
- domain: analysis_and_statistics
  judgment: low
  rationale: Model construction, ridge regression, continuous and categorical ROR, hazard ratios, concordance
    indices, and 1,000 bootstrap comparisons are described, with development and verification cohorts
    kept separate.
  evidence_locations:
  - "Methods \u2014 Statistical methods"
  - "Results \u2014 Clinical verification"
- domain: validation_and_transportability
  judgment: some_concerns
  rationale: The independent tamoxifen cohort supports verification of the locked algorithm, including
    Luminal B and HER2-enriched hazard ratios, but the cohort is historical, Basal-like cases were sparse,
    and prospective decision utility was not evaluated in this report.
  evidence_locations:
  - "Results \u2014 BC TAM verification cohort"
  - Discussion
- domain: reporting_and_reproducibility
  judgment: some_concerns
  rationale: Assay components, transformations, model terms, cohorts, and statistical procedures are documented,
    but commercial reference materials and the full production implementation are not independently reproducible
    from the paper.
  evidence_locations:
  - Methods
  - Discussion
evidence_role: supporting
key_strengths:
- Separates centroid training, ROR development, and independent verification.
- Describes a fixed single-patient FFPE assay with internal controls.
- Uses a prespecified multicomponent ROR model and bootstrap comparisons.
- Reports clinically relevant recurrence associations in an independent cohort.
key_limitations:
- Verification reflects historical treatment and specimen selection.
- Very few Basal-like cases were available for verification.
- Commercial components prevent complete independent reproduction.
- The report does not test prospective clinical decision utility.
conflicts_and_funding: Several authors were PAM50 or Prosigna inventors, Bioclassifier founders, paid
  NanoString consultants, or NanoString employees/shareholders. UNC sample work was supported by NCI grants
  U01 CA114722-01 and P50-CA58223-09A1.
