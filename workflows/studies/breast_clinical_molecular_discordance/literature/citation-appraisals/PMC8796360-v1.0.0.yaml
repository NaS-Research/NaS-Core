study_design: classifier_comparison
eligibility: eligible
domains:
- domain: population_selection
  judgment: some_concerns
  rationale: The study spans 301 microarray and 397 RNA-seq bladder tumors, 3,814 SCAN-B breast tumors,
    18 additional bladder datasets, 19 lung datasets, and 10,088 pan-cancer samples. This is broad, but
    several evaluations reuse retrospective public cohorts, and the breast analysis uses a within-SCAN-B
    50/50 split rather than an independently recruited validation population.
  evidence_locations:
  - "Methods \u2014 Bladder cancer datasets"
  - "Methods \u2014 Additional datasets"
  - "Results \u2014 Breast cancer"
  - "Results \u2014 Lung cancer"
- domain: specimen_and_measurement
  judgment: some_concerns
  rationale: Array and RNA-seq cohorts with heterogeneous preprocessing provide a demanding platform test,
    and tumor-purity behavior is explicitly examined. However, cross-platform differences are not isolated
    from cohort biology, older-array dynamic range caused major failures, and the same specimen was not
    generally assayed on both platforms.
  evidence_locations:
  - "Methods \u2014 Bladder cancer datasets"
  - "Results \u2014 Lung cancer"
  - Discussion
- domain: classifier_implementation
  judgment: low
  rationale: Raw and centered centroids, AIMS, switchBox k-TSP, and the rule-based random forest are described
    with feature-selection rules, parameters, missing-gene imputation, voting/probability outputs, and
    software dependencies. The multiclassPairs R package preserves the training and prediction workflow
    and enables single-sample execution after artifacts are fixed.
  evidence_locations:
  - "Methods \u2014 Centroid classifiers"
  - "Methods \u2014 Rule-based classifiers"
  - Availability and implementation
- domain: reference_comparator
  judgment: some_concerns
  rationale: Bladder labels combine clustering, immunostaining curation, and prior centroids; SCAN-B PAM50
    labels are centroid-derived. These are informative technical targets but not independent biological
    truth, and training to reproduce them makes accuracy partly a measure of label imitation.
  evidence_locations:
  - "Methods \u2014 Bladder cancer datasets"
  - "Results \u2014 Breast cancer"
- domain: analysis_and_statistics
  judgment: some_concerns
  rationale: The work reports OOB accuracy, held-out accuracy, model-size behavior, prediction margins,
    ties, feature importance, purity effects, and failures across many datasets. Numerous model variants
    and datasets were explored without a study-wide multiplicity framework or confidence intervals, and
    several reported training values reuse data employed in feature selection.
  evidence_locations:
  - "Results \u2014 Subtype prediction in bladder cancer"
  - "Results \u2014 Results on additional datasets"
  - Discussion
- domain: validation_and_transportability
  judgment: some_concerns
  rationale: Training on one bladder platform and testing on another, multi-study lung testing, and mixed-platform
    training directly probe transport. Failures on an unrepresented older array are retained. Breast validation
    is only a random split of one RNA-seq population, no unchanged clinical assay is tested, and output
    scores are informative rather than prospectively calibrated uncertainty.
  evidence_locations:
  - "Results \u2014 Absolute Intrinsic Molecular Subtyping \u2014 AIMS"
  - "Results \u2014 Breast cancer"
  - "Results \u2014 Lung cancer"
  - Discussion
- domain: reporting_and_reproducibility
  judgment: low
  rationale: Datasets, splits, transformations, model parameters, performance ranges, failure modes, and
    package availability are reported, with supplementary tables and a public CRAN implementation. This
    supports substantial computational reproduction despite dependence on previously assigned labels.
  evidence_locations:
  - Methods
  - Supplementary Table S1
  - Availability and implementation
evidence_role: supporting
key_strengths:
- Directly compares cohort-dependent centroids with multiple true single-sample predictors.
- Uses large breast, bladder, lung, and pan-cancer collections across platforms.
- Preserves cross-platform failures and identifies unrepresented-platform risk.
- Reports margins, tied scores, purity effects, feature importance, and missing-gene handling.
- Provides an executable public R package.
key_limitations:
- Breast validation is a random split within SCAN-B, not an independent cohort.
- Reference labels are derived from prior clustering or centroid classifiers.
- Mixed-platform training improves transfer but does not guarantee new-platform compatibility.
- Prediction scores are not calibrated patient-level uncertainty or abstention probabilities.
