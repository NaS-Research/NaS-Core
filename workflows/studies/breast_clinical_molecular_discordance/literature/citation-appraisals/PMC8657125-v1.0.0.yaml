study_design: analytical_validation
eligibility: eligible
domains:
- domain: population_selection
  judgment: some_concerns
  rationale: "The study used 94 operable breast cancers diagnosed in 2015\u20132016 within the Oslo2 observational\
    \ cohort; the clinically relevant comparison was limited to 54 node-negative ER-positive/HER2-negative\
    \ cases."
  evidence_locations:
  - "Materials and Methods \u2014 Patient and Tumor Characteristics"
  - Table 1
- domain: specimen_and_measurement
  judgment: some_concerns
  rationale: Each tumor contributed macrodissected FFPE nCounter material and fresh-frozen bulk RNA-seq
    material. This paired design is strong, but tissue region, preparation, tumor enrichment, preservation,
    and platform all differ, so their effects cannot be separated.
  evidence_locations:
  - "Materials and Methods \u2014 RNA Extraction and Gene Expression Analysis"
  - Discussion
- domain: classifier_implementation
  judgment: some_concerns
  rationale: The research implementation reports centering, 46 genes, five centroids, proliferation, tumor
    size, and the ROR equation. Centering was performed separately by dataset and every case received
    a subtype, making results cohort dependent and lacking abstention.
  evidence_locations:
  - "Materials and Methods \u2014 Gene Centering and Subtype Classification"
  - "Materials and Methods \u2014 Risk of Recurrence Score"
- domain: reference_comparator
  judgment: low
  rationale: The clinically approved Prosigna result from macrodissected FFPE tissue is an appropriate
    benchmark for testing research-derived FFPE and bulk-tissue estimates in the same tumors.
  evidence_locations:
  - "Results \u2014 ROR-Macro recapitulates ROR-Prosigna"
  - Figure 2
- domain: analysis_and_statistics
  judgment: some_concerns
  rationale: Paired correlations, categorical thresholds, per-gene comparisons, and specimen-level discrepancies
    are transparent. The sample is small, confidence intervals for discordance are not emphasized, and
    hypothetical treatment changes were not prospectively adjudicated.
  evidence_locations:
  - "Results \u2014 Comparison of ROR scores"
  - Table 2
- domain: validation_and_transportability
  judgment: some_concerns
  rationale: The study directly tests an alternative research workflow against approved results, finding
    13 of 54 risk-category discordances. It is a single cohort without repeat sampling, external replication,
    or prospective decisions.
  evidence_locations:
  - "Results \u2014 Comparison of ROR scores"
  - Discussion
- domain: reporting_and_reproducibility
  judgment: low
  rationale: Cohort characteristics, formulas, thresholds, sample-level discrepancies, code supplements,
    and data accessions EGA EGAS00001003631 and GEO GSE135298 are reported.
  evidence_locations:
  - Materials and Methods
  - Data Availability Statement
evidence_role: supporting
key_strengths:
- Uses paired preparations from the same 94 tumors.
- Benchmarks research calculations against approved Prosigna outputs.
- Reports 13 of 54 discordant risk groups and the affected specimen details.
- Provides code and public normalized data.
key_limitations:
- Multiple specimen and platform factors differ simultaneously.
- Clinically eligible subgroup contains only 54 cases.
- Dataset-specific centering is cohort dependent.
- Treatment effects are hypothetical and no outcome utility is tested.
