title: Correlation of Immunological and Histopathological Features with Gene Expression-Based Classifiers
  in Colon Cancer Patients.
pmid: '36293565'
doi: 10.3390/ijms232012707
full_text_source_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9604175/fullTextXML
