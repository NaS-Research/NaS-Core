study_design: analytical_validation
eligibility: eligible
domains:
- domain: population_selection
  judgment: some_concerns
  rationale: The study combines banked and population-based ovarian cases and includes thirty paired preserved
    and frozen specimens. Survival analysis uses a restricted high-grade advanced-stage subgroup, with
    no prospective enrollment.
  evidence_locations:
  - "Methods \u2014 tumor specimens"
  - "Results \u2014 study population"
- domain: specimen_and_measurement
  judgment: high
  rationale: Paired tissue is a strong preservation design, but frozen and paraffin material used different
    microarray platforms. Quality failures, degraded RNA, and batch effects required post hoc handling.
  evidence_locations:
  - "Methods \u2014 expression profiling"
  - "Results \u2014 quality control"
- domain: classifier_implementation
  judgment: high
  rationale: Published signatures are adapted through probe matching and weights estimated from the same
    paired samples used to assess transport. That supervised bridge is not an unchanged frozen classifier.
  evidence_locations:
  - "Methods \u2014 signature validation"
  - "Methods \u2014 cross-platform weighting"
- domain: reference_comparator
  judgment: some_concerns
  rationale: Paired frozen measurements, histology, and observed survival provide relevant comparators.
    Subtype clusters and frozen-platform signatures remain imperfect proxies rather than independent molecular
    truth.
  evidence_locations:
  - "Methods \u2014 signatures"
  - "Results \u2014 subtype and survival"
- domain: analysis_and_statistics
  judgment: high
  rationale: Correlation, clustering, and adjusted survival models are reported. Adaptation and evaluation
    share paired data, multiple signatures are explored, and uncertainty around classification performance
    is incomplete.
  evidence_locations:
  - Statistical methods
  - Results
- domain: validation_and_transportability
  judgment: high
  rationale: The adapted signatures are not validated in a separate paraffin cohort with frozen comparators.
    Ovarian tissue, legacy assays, and retrospective outcome association do not establish breast-method
    reliability or treatment utility.
  evidence_locations:
  - Results
  - Discussion
- domain: reporting_and_reproducibility
  judgment: some_concerns
  rationale: Cohort sources, platforms, transformations, and signature analyses are described. A locked
    implementation, dependency environment, and externally reusable fitted bridge are not preserved.
  evidence_locations:
  - Methods
  - Data availability
evidence_role: context_only
key_strengths:
- Includes thirty paired preserved and frozen ovarian specimens.
- Reports assay failures and batch effects.
- Evaluates both molecular grouping and outcome association.
key_limitations:
- Preservation is confounded with platform and requires learned cross-platform adaptation.
- Adaptation and evaluation are not independently separated.
- The retrospective ovarian evidence does not validate a breast classifier.
conflicts_and_funding: The article reports National Cancer Institute support and contains no basis for
  a NaS clinical-performance claim.
