study_design: prediction_model
eligibility: eligible
domains:
- domain: population_selection
  judgment: some_concerns
  rationale: Derivation pools three large colorectal expression cohorts, followed by additional public
    validation cohorts. Historical retrospective samples and eligibility differences may not represent
    prospective clinical deployment.
  evidence_locations:
  - "Methods \u2014 datasets"
  - "Results \u2014 validation cohorts"
- domain: specimen_and_measurement
  judgment: some_concerns
  rationale: The method is tested across several transcriptomic datasets and relies on epithelial genes,
    which may reduce stromal dependence. Cross-platform preprocessing and laboratory repeatability are
    not empirically validated with paired technical samples.
  evidence_locations:
  - "Methods \u2014 data preprocessing"
  - "Discussion \u2014 limitations"
- domain: classifier_implementation
  judgment: some_concerns
  rationale: A fixed gene set, synthetic centroids, nearest-neighbor rules, and quality thresholds are
    documented, and an R implementation is available. Some thresholds are adjustable and centroid construction
    includes random grouping without a clearly frozen seed.
  evidence_locations:
  - "Methods \u2014 classifier construction"
  - Software availability
- domain: reference_comparator
  judgment: high
  rationale: Validation labels are produced by reclustering against a large reference collection rather
    than independent biological truth. Agreement therefore measures reproduction of a constructed subtype
    target.
  evidence_locations:
  - "Methods \u2014 ground truth reference"
  - "Results \u2014 classification accuracy"
- domain: analysis_and_statistics
  judgment: some_concerns
  rationale: Accuracy, quality filtering, perturbation tests, and outcome associations are reported. Simulated
    noise and gene removal do not replace empirical assay-error calibration, and patient-level calibration
    or decision utility is absent.
  evidence_locations:
  - "Methods \u2014 robustness tests"
  - Results
- domain: validation_and_transportability
  judgment: some_concerns
  rationale: Multiple held-out datasets and an open implementation support technical transport. Evidence
    remains retrospective, colorectal-specific, and does not demonstrate prospective treatment interaction
    or patient benefit.
  evidence_locations:
  - "Results \u2014 external validation"
  - Discussion
- domain: reporting_and_reproducibility
  judgment: low
  rationale: Genes, centroid strategy, thresholds, public cohorts, source code, and software package are
    reported in sufficient detail for substantial independent reconstruction, although a fully frozen
    environment is still absent.
  evidence_locations:
  - Methods
  - Data and code availability
evidence_role: context_only
key_strengths:
- Provides an open single-sample implementation with explicit quality filtering.
- Uses multiple public cohorts and several robustness perturbations.
- Clearly distinguishes epithelial subtype prediction from broader microenvironment state.
key_limitations:
- The target labels are constructed references rather than independent truth.
- Simulated perturbations do not calibrate real laboratory measurement error.
- Retrospective colorectal results do not establish breast-method or treatment utility.
conflicts_and_funding: The article reports Geneva institutional and foundation support and should be interpreted
  as methodological prior art, not independent validation of NaS.
