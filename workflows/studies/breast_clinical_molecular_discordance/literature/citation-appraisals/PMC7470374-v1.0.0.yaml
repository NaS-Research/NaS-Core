title: 'Computational approaches to support comparative analysis of multiparametric tests: Modelling versus
  Training.'
pmid: '32881987'
doi: 10.1371/journal.pone.0238593
full_text_source_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7470374/fullTextXML
