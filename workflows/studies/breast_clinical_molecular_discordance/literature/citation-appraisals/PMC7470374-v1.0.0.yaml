access_basis: Creative Commons Attribution 4.0 International (CC-BY-4.0).
study_design: classifier_comparison
eligibility: eligible
domains:
- domain: population_selection
  judgment: some_concerns
  rationale: OPTIMA prelim randomized 313 participants; 302 specimens were available and 274 had multiple
    commercial results. This is a strong head-to-head sample, but exclusions and the selected trial population
    constrain generalization.
  evidence_locations:
  - "Methods \u2014 OPTIMA prelim"
  - "Results \u2014 Samples available for analysis"
- domain: specimen_and_measurement
  judgment: some_concerns
  rationale: Commercial assays and NanoString expression were derived from the same tumor material where
    possible, reducing biological variation. Proprietary preprocessing, references, and platform differences
    could not be fully reconstructed.
  evidence_locations:
  - "Methods \u2014 Laboratory methods"
  - "Methods \u2014 Modelling commercial tests"
- domain: classifier_implementation
  judgment: some_concerns
  rationale: Training procedures were explicit, but modeled assays necessarily estimated undocumented
    proprietary centering, scaling, reference, and algorithm details. The resulting models are approximations
    rather than exact assay implementations.
  evidence_locations:
  - "Methods \u2014 Modelling"
  - "Methods \u2014 Training"
- domain: reference_comparator
  judgment: low
  rationale: Actual commercial test outputs on the same tumors serve as the direct technical reference
    for each approximation, matching the stated objective.
  evidence_locations:
  - "Methods \u2014 Commercial test results"
  - "Results \u2014 Comparison with original tests"
- domain: analysis_and_statistics
  judgment: low
  rationale: The cohort was split 50/50, model choices used five-fold cross-validation within training,
    iterations were locked before held-out validation, and both correlations and clinically relevant categorical
    concordance were reported.
  evidence_locations:
  - "Methods \u2014 Training and validation"
  - Results
- domain: validation_and_transportability
  judgment: some_concerns
  rationale: Held-out validation supports internal transport within OPTIMA prelim and trained approximations
    achieved high agreement for several assays. There is no external cohort, new laboratory, or unchanged
    prospective deployment.
  evidence_locations:
  - "Methods \u2014 Validation"
  - Discussion
- domain: reporting_and_reproducibility
  judgment: some_concerns
  rationale: Splits, metrics, approaches, and extensive results are reported, but legal restrictions limit
    the participant data and proprietary commercial algorithms prevent exact independent reconstruction.
  evidence_locations:
  - Methods
  - Data Availability
evidence_role: supporting
key_strengths:
- Uses true commercial outputs from the same trial specimens as references.
- Separates model development and held-out validation.
- Reports continuous, binary, and ternary agreement.
- Demonstrates that training can outperform incomplete algorithm reconstruction.
key_limitations:
- Validation is internal to one trial cohort.
- Proprietary assay details had to be estimated.
- Participant-level data access is restricted.
- Technical agreement does not establish equivalent clinical utility.
conflicts_and_funding: Disclosures include consultancies, honoraria, research funding, patents, and assay-company
  relationships; one author was a NanoString employee/shareholder and several authors were test inventors.
  These relationships are material to interpretation of comparative assay modeling.
