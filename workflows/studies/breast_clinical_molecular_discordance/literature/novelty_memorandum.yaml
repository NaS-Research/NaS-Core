  termination_rationale: >-
    The uncapped evidence inventory reached 81 eligible identities. Sixty-eight
    completed founder-authorized appraisal, thirteen remain access-restricted, and
    none remain pending. Citation passes 6 and 7 were independently closed at zero
    yield, satisfying the locked two-consecutive-pass saturation rule.
claims:
  - claim: >-
      PAM50 assignments can change under defensible changes to test-set composition,
      reference construction, gene content, and expression measurement.
    status: established
    evidence_ids: [PMID:25788628, PMID:32826944, PMID:37857634]
    assessment: >-
      Multiple locked supporting appraisals establish analytical contingency of
      subtype assignment, without establishing a universally correct alternative label.
  - claim: Fixed patient-independent breast-cancer subtyping is prior art.
    status: established
    evidence_ids: [PMID:33255759, PMID:37008073, PMID:35974007]
    assessment: >-
      Single-sample and cohort-independent classifiers have already been published;
      those properties cannot constitute the NaS novelty claim.
  - claim: Patient-level ambiguity, non-assignment, and abstention are PAM50 prior art.
    status: established
    evidence_ids: [PMID:28062443, PMID:37857634]
    assessment: >-
      Existing methods use empirical nulls, multiple-testing control, score margins,
      and explicit ambiguous or not-assigned states.
  - claim: >-
      Specimen handling, tumor composition, and intratumoral heterogeneity can affect
      PAM50 measurements or assignments.
    status: established
    evidence_ids: [PMID:34885228, PMID:36892725, PMID:27036195, PMID:21718502]
    assessment: >-
      Reliability must include pre-analytic and specimen-level limitations rather
      than treating classifier code as the sole source of variation.
  - claim: >-
      Clinical receptor or immunohistochemical categories and expression-derived
      subtype labels can disagree.
    status: partly_established
    evidence_ids: [PMID:27130929, PMID:32881987, PMID:37857634]
    assessment: >-
      Discordance is supported, but no reviewed comparator establishes a universally
      correct patient-level label or permits clinical error attribution.
  - claim: A score margin or perturbation-stability label alone is not novel.
    status: established
    evidence_ids: [PMID:37857634, PMID:28062443]
    assessment: >-
      Both leading-versus-runner-up information and perturbation-derived stability
      categories appear in prior work.
  - claim: >-
      A fixed patient-independent reliability rule calibrated to independently
      measured technical error and validated unchanged across TCGA and SCAN-B remains
      unresolved.
    status: unresolved
    evidence_ids:
      - PMID:24625003
      - PMID:37857634
      - PMID:28062443
      - DOI:10.64898/2026.06.23.26355479
    assessment: >-
      The bounded question remains plausible, but exact reusable artifacts,
      non-outcome thresholds, execution, and unchanged external validation are absent.
  - claim: >-
      The proposed reliability framework improves treatment decisions or outcomes.
    status: unresolved
    evidence_ids: [PMID:35974007, PMID:27130929, PMID:37857634]
    assessment: >-
      No prospective decision-impact or clinical-utility evidence supports this claim;
      the active study remains an analytical research-method evaluation.
no_go_criterion_triggered: >-
  Broad novelty is rejected because single-sample classification, PAM50 margins,
  perturbation stability, ambiguity, non-assignment, and abstention are prior art.
  The exact independently calibrated and unchanged externally validated reliability
  contract is unresolved rather than affirmatively novel.
novelty_claim_authorized: false
recommended_action: hold
limitations:
  - Thirteen eligible studies remain access-restricted and were not appraised.
  - No appraised study qualifies as a low-risk anchor.
  - Saturated literature and founder-authorized synthesis do not authorize novelty.
  - Exact centroids, reference artifacts, transformations, rights, and tolerances remain unresolved.
  - No independently justified technical-error model or outcome-independent threshold is locked.
  - The proposed rule has not been executed or externally validated.
  - No clinical-validity, treatment-selection, decision-impact, or utility claim is authorized.
  - AI assisted evidence synthesis; the founder retains scientific accountability.
