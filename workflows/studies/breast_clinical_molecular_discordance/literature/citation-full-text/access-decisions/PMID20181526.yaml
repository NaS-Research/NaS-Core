policy_reason: >-
  The official publisher landing page exposes bibliographic metadata and the
  structured abstract, but automated PDF delivery returns an access challenge.
  Unpaywall identifies only the same publisher PDF route, Europe PMC reports no
  repository full text, and the credential-free Elsevier text-mining endpoint
  returns metadata without the article body. The license permits reuse, but no
  reproducible, checksum-verifiable full-text delivery route was available.
  No access control was bypassed, no third-party copy was retained, and
  abstract-only content is insufficient for a governed quality appraisal.
