checks:
- check_id: tcga-indexed-receptor-fields
  status: unresolved
  finding: The current GDC case mapping exposes no indexed ER, PR, HER2, estrogen-,
    progesterone-, or receptor-named fields.
  evidence_source_ids:
  - gdc-case-mapping
  limitation: Completeness cannot be estimated without a separately authorized, field-limited
    clinical-supplement route.
- check_id: tcga-open-star-counts
  status: verified
  finding: GDC reports 1231 open TCGA-BRCA STAR - Counts gene-expression files through
    a zero-row aggregate query.
  evidence_source_ids:
  - gdc-status
  - gdc-file-aggregation
- check_id: tcga-pam50-gene-coverage
  status: unresolved
  finding: Source-level GDC metadata confirms the workflow but does not enumerate
    expression-table genes.
  evidence_source_ids:
  - gdc-file-aggregation
  limitation: Exact PAM50 coverage requires a separately authorized schema-only inspection
    of one frozen open file or its authoritative annotation.
- check_id: gse96058-processed-artifacts
  status: verified
  finding: NCBI GEO serves both the declared hg38 annotation and processed 3,273-sample
    plus 136-replicate expression artifacts.
  evidence_source_ids:
  - geo-gse96058-gtf
  - geo-gse96058-expression
- check_id: gse96058-pam50-gene-coverage
  status: unresolved
  finding: HEAD-only source metadata proves artifact availability but cannot prove
    row-level PAM50 coverage or alias resolution.
  evidence_source_ids:
  - geo-gse96058-gtf
  - geo-gse96058-expression
  limitation: Exact coverage requires a separately authorized gene-identifier-only
    projection that discards every expression value.
- check_id: gse96058-receptor-and-replicate-completeness
  status: prohibited
  finding: The GEO family metadata bundle co-mingles receptor and replicate annotations
    with patient-level treatment and survival fields, so it was excluded from this
    executable audit.
  evidence_source_ids:
  - geo-gse96058-expression
  limitation: A reviewed field-isolation procedure and explicit patient-level metadata
    authorization are required before retrieving the family bundle.
decision: changes_requested
decision_rationale: Source availability and the open GDC STAR - Counts workflow are
  verified, but receptor completeness and exact PAM50 gene coverage cannot be established
  without a narrower, separately authorized field/schema inspection.
next_authorization_required:
- Field-limited TCGA clinical-supplement inspection retaining only aggregate ER, PR,
  and HER2 completeness counts.
- Gene-identifier-only inspection of one frozen GDC STAR - Counts artifact with every
  expression value discarded.
- Gene-identifier-only inspection of the GSE96058 processed matrix with every expression
  value discarded.
- Field-isolated GSE96058 receptor and replicate audit that rejects treatment and
  survival fields before derivation.
