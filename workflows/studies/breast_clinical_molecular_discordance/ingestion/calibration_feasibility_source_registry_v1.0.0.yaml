      - publication_approver
    storage_restrictions:
      - Public source files remain outside Git in marker-validated object storage.
      - Receipts record exact URLs, filenames, sizes, checksums, retrieval dates, and terms.
      - Molecular values may be processed deterministically but may not be sent to a generative model.
